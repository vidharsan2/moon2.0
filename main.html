<!DOCTYPE html>
<html lang="en" data-fx-ambient="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy birthday</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Caveat:wght@400..700&display=swap" rel="stylesheet">

  <script src="config.js"></script>
  <script>
    // Keep this page closed until the right PIN has been entered on password.html.
    // ?preview lets you look at it early while you're working on it.
    (function () {
      var p = new URLSearchParams(location.search);
      var open = p.has("preview");
      try { open = open || sessionStorage.getItem("capsuleUnlocked") === "1"; } catch (e) {}
      try { open = open || localStorage.getItem("capsuleUnlocked") === "1"; } catch (e) {}
      if (!open) location.replace("password.html");
    })();
  </script>
  <script src="fx.js"></script>

  <style>
    :root {
      --head: "Marcellus", Georgia, "Times New Roman", serif;
      --text: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      --ground-h: clamp(64px, 10vw, 140px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { background: #000; color: #e8ebff; -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      font-family: var(--text);
      font-size: 1.5rem;
      line-height: 1.6;
      background: #000;
    }

    /* ---------- The sky ---------- */
    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    .moon {
      position: fixed;
      top: clamp(0rem, 3vh, 2.5rem);
      right: clamp(0rem, 5vw, 6rem);
      width: clamp(160px, 30vw, 280px);
      height: auto;
      z-index: 1;
      pointer-events: none;
    }

    .ground {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--ground-h);
      z-index: 1;
      pointer-events: none;
    }

    /* faint glow on the horizon behind the trees */
    .ground::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 280%;
      background: linear-gradient(to top, rgba(48, 70, 160, 0.32), transparent);
    }

    .ground svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---------- Content ---------- */
    .page { position: relative; z-index: 2; }

    .hero {
      min-height: 82svh;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 5rem 1.25rem 2rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: var(--head);
      font-weight: 400;
      line-height: 1.05;
    }

    .hb {
      display: block;
      font-size: clamp(1.5rem, 5vw, 2.6rem);
      letter-spacing: 0.06em;
      color: #cdd4f5;
    }

    .nm {
      display: block;
      margin-top: 0.3em;
      font-size: clamp(3rem, 14vw, 8.2rem);
      letter-spacing: 0.01em;
      color: #fff;
      text-shadow: 0 0 28px rgba(150, 130, 255, 0.55), 0 0 80px rgba(120, 150, 255, 0.25);
      overflow-wrap: anywhere;
    }

    .lede {
      margin: 1.25rem 0 0;
      font-size: clamp(1.5rem, 3.6vw, 2rem);
      color: #cdd4f5;
      text-shadow: 0 1px 12px #000;
    }

    .letter {
      width: min(100% - 2.5rem, 40rem);
      margin: 2.5rem auto 0;
      padding: clamp(1.75rem, 5vw, 2.75rem) clamp(1.5rem, 5vw, 2.5rem);
      background: linear-gradient(180deg, rgba(22, 32, 68, 0.55), rgba(10, 16, 40, 0.55));
      border: 1px solid rgba(175, 195, 255, 0.28);
      border-radius: 26px;
      box-shadow: 0 0 50px rgba(90, 110, 230, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(2px);
    }

    .letter p {
      margin: 0 0 1.4em;
      font-size: clamp(1.5rem, 3vw, 1.85rem);
      line-height: 1.55;
      color: #e8ebff;
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9);
    }

    .letter .greeting {
      font-family: var(--head);
      font-size: clamp(1.5rem, 3.4vw, 1.9rem);
      color: #fff;
    }

    .letter .sign { margin: 2.2em 0 0.1em; }
    .letter .from { font-family: var(--head); font-size: 1.7rem; color: #fff; }

    /* Highlighted phrases: a glowing marker stroke that sweeps in as she scrolls to it */
    .letter .hl {
      color: #fff3c9;
      font-weight: 600;
      padding: 0 0.12em;
      text-shadow: 0 0 16px rgba(255, 214, 120, 0.55), 0 1px 12px rgba(0, 0, 0, 0.9);
      background-image: linear-gradient(100deg, rgba(255, 226, 154, 0.10), rgba(255, 226, 154, 0.34) 8%, rgba(255, 190, 120, 0.26) 92%, rgba(255, 190, 120, 0.08));
      background-repeat: no-repeat;
      background-position: 0 88%;
      background-size: 0% 62%;
      border-radius: 4px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      transition: background-size 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s;
    }
    .letter .hl.on { background-size: 100% 62%; }

    /* ---------- Photo gallery: polaroids hanging from pins ---------- */
    .gallery {
      width: min(100% - 2rem, 50rem);
      margin: 0 auto;
      padding: 3.2rem 0 2.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 3.2rem 2.2rem;
    }
    .gallery:empty { display: none; }

    .gallery figure {
      position: relative;
      margin: 0;
      width: clamp(150px, 38vw, 230px);
      background: #fdfaf2;
      padding: 0.9rem 0.9rem 1.5rem;
      border-radius: 3px;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.5);
      transform: rotate(var(--tilt, -2deg));
      transition: transform 0.25s ease;
    }
    .gallery figure:nth-child(2n) { margin-top: 2.6rem; }
    .gallery figure:hover { transform: rotate(0deg) scale(1.04); }

    /* the pin */
    .gallery figure::before {
      content: "";
      position: absolute;
      top: -2.1rem;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #ffb0b8, #e23b4e 72%);
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.55);
      z-index: 2;
    }
    /* the string from pin to photo */
    .gallery figure::after {
      content: "";
      position: absolute;
      top: -1.95rem;
      left: 50%;
      width: 1px;
      height: 2rem;
      background: rgba(205, 215, 255, 0.5);
    }

    .gallery img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      filter: saturate(0.97);
    }
    .gallery figcaption {
      padding-top: 0.65rem;
      font-family: var(--text);
      font-size: 1.35rem;
      line-height: 1.2;
      color: #2b2924;
      text-align: center;
    }
    .gallery .missing {
      width: clamp(150px, 38vw, 230px);
      padding: 2.6rem 1rem;
      text-align: center;
      font-size: 0.85rem;
      font-family: var(--body);
      color: #6b5f52;
      background: #fdfaf2;
      border-radius: 3px;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.5);
    }

    .wish {
      width: min(100% - 2.5rem, 38rem);
      margin: 0 auto;
      padding: 1.5rem 0 calc(var(--ground-h) + 4rem);
      text-align: center;
    }

    .wish p { margin: 0 0 1.2rem; font-size: 1.6rem; color: #cdd4f5; text-shadow: 0 1px 12px #000; }

    .wish button {
      font-family: var(--head);
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(220, 225, 255, 0.5);
      padding: 0.9rem 2.2rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(140, 130, 255, 0.25);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .wish button:hover { background: rgba(255, 255, 255, 0.14); box-shadow: 0 0 44px rgba(150, 140, 255, 0.45); }
    .wish button:focus-visible { outline: 3px solid #ffe29a; outline-offset: 4px; }

    .wish .note { min-height: 1.7em; margin: 1rem 0 0; color: #ffe29a; font-style: normal; }


    /* ---------- Sound toggle ---------- */
    .sound-toggle {
      position: fixed;
      top: clamp(0.75rem, 2vh, 1.25rem);
      left: clamp(0.75rem, 3vw, 1.5rem);
      z-index: 5;
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 999px;
      border: 1px solid rgba(220, 225, 255, 0.4);
      background: rgba(10, 15, 35, 0.55);
      color: #fff;
      font-size: 1.2rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .sound-toggle:focus-visible { outline: 3px solid #ffe29a; outline-offset: 3px; }


    /* ---------- Full-screen photo preview ---------- */
    .gallery img { cursor: zoom-in; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(4px);
      cursor: zoom-out;
      animation: lbIn 0.2s ease both;
    }
    .lightbox img {
      max-width: min(92vw, 720px);
      max-height: 86vh;
      width: auto;
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      cursor: default;
    }
    .lightbox-close {
      position: absolute;
      top: clamp(0.75rem, 2vh, 1.5rem);
      right: clamp(0.75rem, 3vw, 1.5rem);
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 999px;
      border: 1px solid rgba(220, 225, 255, 0.4);
      background: rgba(10, 15, 35, 0.6);
      color: #fff;
      font-size: 1.2rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .lightbox-close:focus-visible, .sound-toggle:focus-visible { outline: 3px solid #ffe29a; outline-offset: 3px; }
    @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .lightbox { animation: none; } }

    @media (prefers-reduced-motion: reduce) {
      .wish button { transition: none; }
      .letter .hl { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <button type="button" class="sound-toggle" id="sound-toggle" aria-label="Turn music on or off" hidden>🔈</button>
  <audio id="bgm" loop></audio>

  <!-- Crescent moon (like the moon emoji): textured surface, soft terminator, faint earthshine on the dark side -->
  <svg class="moon" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0.28" stop-color="#e6ebff" stop-opacity="0.20"/>
        <stop offset="0.55" stop-color="#9fb0ff" stop-opacity="0.06"/>
        <stop offset="1" stop-color="#9fb0ff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="earthshine" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#26304f"/>
        <stop offset="1" stop-color="#0b0e1a"/>
      </linearGradient>
      <linearGradient id="falloff" gradientUnits="userSpaceOnUse" x1="38" x2="64" y1="0" y2="0">
        <stop offset="0" stop-color="#0a0c15" stop-opacity="0"/>
        <stop offset="0.6" stop-color="#0a0c15" stop-opacity="0.18"/>
        <stop offset="1" stop-color="#0a0c15" stop-opacity="0.6"/>
      </linearGradient>
      <!-- Cratered, bumpy moon surface lit from the left -->
      <filter id="regolith" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="6" seed="11" result="noise"/>
        <feDiffuseLighting in="noise" lighting-color="#f3ecd9" surfaceScale="3.2" diffuseConstant="1.15" result="lit">
          <feDistantLight azimuth="180" elevation="48"/>
        </feDiffuseLighting>
        <feComposite in="lit" in2="SourceGraphic" operator="in"/>
      </filter>
      <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
        <feGaussianBlur stdDeviation="1.8"/>
      </filter>
      <filter id="bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <filter id="mblur" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
        <feGaussianBlur stdDeviation="1.6"/>
      </filter>
      <mask id="cresMask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
        <path d="M100 38 A62 62 0 0 0 100 162 A42 62 0 0 1 100 38 Z" fill="#fff" filter="url(#soft)"/>
      </mask>
      <clipPath id="disc"><circle cx="100" cy="100" r="62"/></clipPath>
    </defs>
    <g transform="rotate(-24 100 100)">
      <circle cx="100" cy="100" r="100" fill="url(#halo)"/>
      <!-- the dark side, barely visible -->
      <circle cx="100" cy="100" r="62" fill="url(#earthshine)" opacity="0.2"/>
      <!-- glow around the lit edge -->
      <path d="M100 38 A62 62 0 0 0 100 162 A42 62 0 0 1 100 38 Z" fill="#fff4d6" filter="url(#bloom)" opacity="0.5"/>
      <g mask="url(#cresMask)">
        <circle cx="100" cy="100" r="62" fill="#efe8d6" filter="url(#regolith)"/>
        <g clip-path="url(#disc)">
          <g filter="url(#mblur)" opacity="0.5">
            <ellipse cx="55" cy="90" rx="9" ry="13" fill="#6b685e"/>
            <ellipse cx="60" cy="116" rx="8" ry="7" fill="#726f64"/>
            <ellipse cx="66" cy="76" rx="7" ry="5" fill="#77746a"/>
            <circle cx="50" cy="108" r="5" fill="#66635a"/>
          </g>
          <g fill="rgba(50,48,42,0.32)" stroke="rgba(255,250,235,0.35)" stroke-width="0.7">
            <circle cx="47" cy="80" r="3.2"/>
            <circle cx="52" cy="128" r="2.6"/>
            <circle cx="62" cy="99" r="2.2"/>
            <circle cx="70" cy="132" r="1.8"/>
            <circle cx="58" cy="66" r="1.6"/>
            <circle cx="46" cy="96" r="1.4"/>
          </g>
        </g>
        <rect x="0" y="0" width="200" height="200" fill="url(#falloff)"/>
      </g>
    </g>
  </svg>

  <!-- Distant treeline -->
  <div class="ground" aria-hidden="true">
    <svg id="trees" viewBox="0 0 1440 120" preserveAspectRatio="xMidYMax slice"></svg>
  </div>

  <main class="page">
    <header class="hero">
      <h1><span class="hb">Happy birthday,</span><span class="nm" id="name"></span></h1>
      <p class="lede" id="lede"></p>
    </header>

    <section class="letter" id="letter"></section>

    <section class="gallery" id="gallery"></section>

    <!-- Tap a photo to see it full-screen; tap again anywhere to close -->
    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close photo">✕</button>
      <img id="lightbox-img" alt="">
    </div>

    <section class="wish">
      <p id="wish-line"></p>
      <button type="button" id="wish-btn">Make a wish</button>
      <p class="note" id="wish-note" aria-live="polite"></p>
    </section>
  </main>

  <script>
    /* ---------- Fill in the words from config.js ---------- */
    (function () {
      var C = window.CAPSULE;
      var $ = function (id) { return document.getElementById(id); };

      document.title = "Happy birthday, " + C.friendName;
      $("name").textContent = C.friendName;
      $("lede").textContent = C.lede || "";
      $("lede").hidden = !C.lede;

      var letter = $("letter");
      var greet = document.createElement("p");
      greet.className = "greeting";
      greet.textContent = "Dear " + C.friendName + ",";
      letter.appendChild(greet);

      // In config.js, wrap a phrase in **double stars** to highlight it.
      (C.letter || []).forEach(function (text) {
        var p = document.createElement("p");
        var parts = text.replace(/\{name\}/g, C.friendName).split(/\*\*(.+?)\*\*/);
        parts.forEach(function (part, i) {
          if (i % 2) {
            var span = document.createElement("span");
            span.className = "hl";
            span.textContent = part;
            p.appendChild(span);
          } else if (part) {
            p.appendChild(document.createTextNode(part));
          }
        });
        letter.appendChild(p);
      });

      // Sweep the highlight in when each phrase scrolls into view
      var marks = Array.prototype.slice.call(letter.querySelectorAll(".hl"));
      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add("on"); io.unobserve(e.target); }
          });
        }, { threshold: 0.6 });
        marks.forEach(function (m) { io.observe(m); });
      } else {
        marks.forEach(function (m) { m.classList.add("on"); });
      }

      var sign = document.createElement("p");
      sign.className = "sign";
      sign.textContent = C.signOff || "";
      var from = document.createElement("p");
      from.className = "from";
      from.textContent = C.fromName;
      letter.appendChild(sign);
      letter.appendChild(from);

      $("wish-line").textContent = C.wishLine || "";

      // ---- Photo gallery: reads C.photos from config.js ----
      var gallery = $("gallery");
      var tilts = [-3, 2, -2, 3, -4, 2.5];
      (C.photos || []).forEach(function (photo, idx) {
        var src = typeof photo === "string" ? photo : photo.src;
        var caption = typeof photo === "string" ? "" : (photo.caption || "");
        var fig = document.createElement("figure");
        fig.style.setProperty("--tilt", tilts[idx % tilts.length] + "deg");
        var img = document.createElement("img");
        img.src = src;
        img.loading = "lazy";
        img.alt = caption || (C.friendName + " photo");
        img.onerror = function () {
          fig.innerHTML = "";
          fig.className = "missing";
          fig.textContent = "Can't find \"" + src + "\" — put that file next to index.html";
        };
        fig.appendChild(img);
        if (caption) {
          var cap = document.createElement("figcaption");
          cap.textContent = caption;
          fig.appendChild(cap);
        }
        img.addEventListener("click", function () {
          lbImg.src = src;
          lbImg.alt = img.alt;
          lightbox.hidden = false;
        });
        gallery.appendChild(fig);
      });

      // ---- Full-screen preview ----
      var lightbox = $("lightbox"), lbImg = $("lightbox-img");
      function closeLightbox() { lightbox.hidden = true; lbImg.src = ""; }
      lightbox.addEventListener("click", closeLightbox);
      $("lightbox-close").addEventListener("click", function (e) { e.stopPropagation(); closeLightbox(); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !lightbox.hidden) closeLightbox(); });

      // ---- Background song: tries to play as soon as this page opens,
      // and falls back to starting on her first tap if the browser blocks it ----
      var audio = $("bgm");
      var soundBtn = $("sound-toggle");
      if (C.song) {
        audio.src = C.song;
        soundBtn.hidden = false;

        var FX = window.FX || null;
        var userMuted = !!(FX && FX.muted);           // she muted the sound on an earlier page
        var updateIcon = function () { soundBtn.textContent = audio.paused ? "\uD83D\uDD08" : "\uD83D\uDD0A"; };
        var tryPlay = function () { var p = audio.play(); if (p && p.then) p.then(updateIcon).catch(function () {}); };

        if (!userMuted) tryPlay(); else updateIcon();

        // browsers may block autoplay: start on her first tap anywhere (but not on the sound button itself)
        var kick = function (e) {
          if (e && e.target && soundBtn.contains(e.target)) return;
          ["pointerdown", "keydown", "touchstart"].forEach(function (evt) { document.removeEventListener(evt, kick, true); });
          if (!userMuted && audio.paused) tryPlay();
        };
        ["pointerdown", "keydown", "touchstart"].forEach(function (evt) { document.addEventListener(evt, kick, true); });

        soundBtn.addEventListener("click", function () {
          if (audio.paused) { userMuted = false; if (FX) FX.setMuted(false); tryPlay(); }
          else { userMuted = true; if (FX) FX.setMuted(true); audio.pause(); updateIcon(); }
        });
        audio.addEventListener("play", updateIcon);
        audio.addEventListener("pause", updateIcon);
      }
    })();

    /* ---------- Treeline silhouette ---------- */
    (function () {
      var svg = document.getElementById("trees");
      var seed = 7;
      function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

      function line(fill, baseY, minH, maxH, minW, maxW) {
        var d = "M0 120 L0 " + baseY;
        var x = 0;
        while (x < 1440) {
          var w = minW + rnd() * (maxW - minW);
          var h = minH + rnd() * (maxH - minH);
          var y = baseY + 5 * Math.sin(x / 170);
          d += " L" + (x + w * 0.5).toFixed(1) + " " + (y - h).toFixed(1) + " L" + (x + w).toFixed(1) + " " + y.toFixed(1);
          x += w * 0.85;
        }
        d += " L1440 120 Z";
        var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", d);
        p.setAttribute("fill", fill);
        svg.appendChild(p);
      }

      line("#070b1c", 98, 10, 34, 10, 18);   // far trees, slightly lit by the horizon
      line("#000000", 108, 12, 46, 9, 16);   // near trees, pure black
    })();

    /* ---------- The night sky ---------- */
    (function () {
      var canvas = document.getElementById("sky");
      var ctx = canvas.getContext("2d");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var TAU = Math.PI * 2;
      var W, H, milky, stars = [], sparkles = [], comets = [], meteors = [];

      // Seeded random so the sky looks the same every time (seed is the birthday)
      function mulberry32(a) {
        return function () {
          a |= 0; a = a + 0x6d2b79f5 | 0;
          var t = Math.imul(a ^ a >>> 15, 1 | a);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }

      var tints = ["rgb(255,255,255)", "rgb(200,215,255)", "rgb(255,244,220)", "rgb(255,205,160)", "rgb(170,190,255)"];
      var glows = ["190,205,255", "255,236,210", "210,225,255"];

      function build() {
        W = canvas.width = Math.round(window.innerWidth * dpr);
        H = canvas.height = Math.round(window.innerHeight * dpr);
        var r = mulberry32(20092026);
        function gauss() { return (r() + r() + r() + r() - 2) / 2; }

        // Moonlight washes out the stars around the moon
        var mo = document.querySelector(".moon").getBoundingClientRect();
        var moonX = (mo.left + mo.width / 2) * dpr, moonY = (mo.top + mo.height / 2) * dpr;
        var moonR = mo.width * 0.31 * dpr;
        function moonFade(x, y) {
          var d = Math.hypot(x - moonX, y - moonY);
          var k = (d - moonR * 1.1) / (moonR * 2.6);
          return k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k);
        }

        // Background: black, a touch of deep blue near the horizon, and a faint Milky Way
        milky = document.createElement("canvas");
        milky.width = W; milky.height = H;
        var m = milky.getContext("2d");
        var bg = m.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, "#000000");
        bg.addColorStop(0.6, "#02030a");
        bg.addColorStop(1, "#080d26");
        m.fillStyle = bg;
        m.fillRect(0, 0, W, H);

        var ang = -0.8, dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
        var cx = W * 0.5, cy = H * 0.5, L = Math.hypot(W, H), bw = Math.min(W, H) * 0.28;
        var i;

        // Broad glow of the galaxy band
        m.lineCap = "butt";
        for (i = 0; i < 10; i++) {
          m.strokeStyle = "rgba(110,120,210,0.012)";
          m.lineWidth = bw * 2.2 * (1 - (i / 9) * 0.85);
          m.beginPath(); m.moveTo(cx - dx * L, cy - dy * L); m.lineTo(cx + dx * L, cy + dy * L); m.stroke();
        }
        // Lumpy star clouds: many soft blobs, warmer toward the bright core
        function blob(x, y, rad, rgb, a) {
          var g = m.createRadialGradient(x, y, 0, x, y, rad);
          g.addColorStop(0, "rgba(" + rgb + "," + a.toFixed(4) + ")");
          g.addColorStop(1, "rgba(" + rgb + ",0)");
          m.fillStyle = g;
          m.fillRect(x - rad, y - rad, rad * 2, rad * 2);
        }
        for (i = 0; i < 100; i++) {
          var al = (r() * 2 - 1) * L * 0.5, of = gauss() * bw * 0.55;
          var bx = cx + dx * al + nx * of, by = cy + dy * al + ny * of;
          var core = Math.max(0, 1 - Math.abs(al) / (L * 0.28));
          var warm = r() < 0.35 * core;
          blob(bx, by, bw * (0.18 + r() * 0.5), warm ? "235,205,170" : "150,170,235", 0.02 + r() * 0.045 * (0.5 + core));
        }
        // Dark dust lanes cutting through the glow
        for (i = 0; i < 30; i++) {
          var dl = (r() * 2 - 1) * L * 0.42, dof = gauss() * bw * 0.28;
          blob(cx + dx * dl + nx * dof, cy + dy * dl + ny * dof, bw * (0.08 + r() * 0.2), "0,0,4", 0.10 + r() * 0.12);
        }
        // Thousands of tiny far-away stars packed along the band
        var n = Math.min(4200, Math.round(W * H / 1200));
        for (i = 0; i < n; i++) {
          var along = (r() * 2 - 1) * L * 0.5, off = gauss() * bw * 0.9;
          var x = cx + dx * along + nx * off, y = cy + dy * along + ny * off;
          if (x < 0 || y < 0 || x > W || y > H) continue;
          var a = (0.06 + r() * 0.4 * (1 - Math.min(1, Math.abs(off) / bw))) * moonFade(x, y);
          m.fillStyle = "rgba(" + (190 + r() * 60 | 0) + "," + (200 + r() * 50 | 0) + ",255," + a.toFixed(3) + ")";
          var s = r() < 0.08 ? dpr * 1.2 : dpr * 0.7;
          m.fillRect(x, y, s, s);
        }
        // A scatter of faint stars over the whole sky (not only the band)
        for (i = 0; i < Math.round(W * H / 5000); i++) {
          var fx = r() * W, fy = r() * H * 0.97;
          m.fillStyle = "rgba(220,228,255," + ((0.08 + r() * 0.25) * moonFade(fx, fy)).toFixed(3) + ")";
          m.fillRect(fx, fy, dpr * 0.8, dpr * 0.8);
        }

        // Individual stars that twinkle
        stars = [];
        var count = Math.min(1100, Math.round(W * H / (dpr * dpr) / 2000));
        for (i = 0; i < count; i++) {
          var p = r();
          var tint = p < 0.45 ? 0 : p < 0.75 ? 1 : p < 0.9 ? 2 : p < 0.96 ? 3 : 4;
          var sx = r() * W, sy = r() * H * 0.97;
          var mag = Math.pow(r(), 9);                       // most stars faint, very few bright
          stars.push({
            x: sx, y: sy,
            r: (0.3 + mag * 2.1) * dpr,
            a: (0.22 + mag * 0.75 + r() * 0.2) * moonFade(sx, sy),
            sp: 0.6 + r() * 2.6, ph: r() * TAU, c: tints[tint],
            spike: mag > 0.6
          });
        }

        // Glittering four-point sparkle stars
        sparkles = [];
        var sn = window.innerWidth < 600 ? 4 : 7;
        for (i = 0; i < sn; i++) {
          var px = (0.04 + r() * 0.92) * W, py = (0.04 + r() * 0.8) * H;
          if (moonFade(px, py) < 0.6) continue;   // keep the moon clear
          sparkles.push({
            x: px, y: py,
            r: (5 + r() * 7) * dpr, sp: 0.5 + r() * 1.1, ph: r() * TAU,
            gl: glows[Math.floor(r() * glows.length)]
          });
        }
      }

      function drawStars(t) {
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var tw = reduce ? 1 : 0.72 + 0.28 * (0.6 * Math.sin(t * s.sp + s.ph) + 0.4 * Math.sin(t * s.sp * 2.7 + s.ph * 1.3));
          ctx.fillStyle = s.c;
          ctx.globalAlpha = Math.min(1, s.a) * tw;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
          if (s.r > 1.1 * dpr) {
            ctx.globalAlpha = 0.09 * tw * (s.a > 0.4 ? 1 : 0.5);
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 3.4, 0, TAU); ctx.fill();
          }
          if (s.spike) {
            var len = s.r * 7;
            ctx.globalAlpha = 0.3 * tw * Math.min(1, s.a * 1.2);
            ctx.strokeStyle = s.c; ctx.lineWidth = 0.6 * dpr; ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(s.x - len, s.y); ctx.lineTo(s.x + len, s.y);
            ctx.moveTo(s.x, s.y - len); ctx.lineTo(s.x, s.y + len);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 1;
      }

      function fourPoint(x, y, r, pinch) {
        var w = r * pinch;
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.quadraticCurveTo(x + w, y - w, x + r, y);
        ctx.quadraticCurveTo(x + w, y + w, x, y + r);
        ctx.quadraticCurveTo(x - w, y + w, x - r, y);
        ctx.quadraticCurveTo(x - w, y - w, x, y - r);
        ctx.fill();
      }

      function drawSparkles(t) {
        for (var i = 0; i < sparkles.length; i++) {
          var s = sparkles[i];
          var k = reduce ? 1 : 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
          var r = s.r * (0.5 + 0.5 * k);
          var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 2.4);
          g.addColorStop(0, "rgba(" + s.gl + "," + (0.38 * k).toFixed(3) + ")");
          g.addColorStop(1, "rgba(" + s.gl + ",0)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.4, 0, TAU); ctx.fill();

          ctx.fillStyle = "rgba(255,255,255," + (0.6 + 0.4 * k).toFixed(3) + ")";
          fourPoint(s.x, s.y, r, 0.07);
          ctx.save();
          ctx.translate(s.x, s.y); ctx.rotate(Math.PI / 4);
          ctx.fillStyle = "rgba(255,255,255," + (0.35 * k).toFixed(3) + ")";
          fourPoint(0, 0, r * 0.5, 0.08);
          ctx.restore();
        }
      }

      /* Comets: slow, with a straight blue-white ion tail and a warmer dust tail */
      function spawnComet() {
        var right = Math.random() < 0.5, a = 0.3 + Math.random() * 0.35, sp = (60 + Math.random() * 30) * dpr;
        comets.push({
          x: right ? W * (0.7 + Math.random() * 0.35) : W * (-0.05 + Math.random() * 0.3),
          y: H * (0.02 + Math.random() * 0.3),
          vx: (right ? -1 : 1) * Math.cos(a) * sp, vy: Math.sin(a) * sp,
          len: (240 + Math.random() * 160) * dpr
        });
      }

      function tail(c, len, halfW, spread, c0, c1) {
        var sp = Math.hypot(c.vx, c.vy), ux = -c.vx / sp, uy = -c.vy / sp, nx = -uy, ny = ux;
        var ex = c.x + ux * len + nx * spread, ey = c.y + uy * len + ny * spread;
        var g = ctx.createLinearGradient(c.x, c.y, ex, ey);
        g.addColorStop(0, c0); g.addColorStop(1, c1);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(c.x + nx * halfW, c.y + ny * halfW);
        ctx.lineTo(ex, ey);
        ctx.lineTo(c.x - nx * halfW, c.y - ny * halfW);
        ctx.closePath(); ctx.fill();
      }

      function drawComet(c) {
        tail(c, c.len * 0.7, 7 * dpr, 24 * dpr, "rgba(255,230,190,0.4)", "rgba(255,200,140,0)");
        tail(c, c.len, 2.6 * dpr, 0, "rgba(190,225,255,0.85)", "rgba(120,170,255,0)");
        var g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 16 * dpr);
        g.addColorStop(0, "rgba(255,255,255,0.95)");
        g.addColorStop(0.35, "rgba(170,210,255,0.35)");
        g.addColorStop(1, "rgba(170,210,255,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(c.x, c.y, 16 * dpr, 0, TAU); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(c.x, c.y, 2.3 * dpr, 0, TAU); ctx.fill();
      }

      /* Shooting stars: quick streaks */
      function spawnMeteor(big) {
        var dir = Math.random() < 0.5 ? 1 : -1, a = 0.45 + Math.random() * 0.3;
        var sp = (big ? 1300 : 900 + Math.random() * 500) * dpr;
        meteors.push({
          x: dir > 0 ? W * Math.random() * 0.6 : W * (0.4 + Math.random() * 0.6),
          y: H * Math.random() * 0.4,
          vx: dir * Math.cos(a) * sp, vy: Math.sin(a) * sp,
          len: (big ? 280 : 110 + Math.random() * 90) * dpr,
          life: 0, max: big ? 1.3 : 0.6 + Math.random() * 0.4
        });
      }

      function drawMeteor(m) {
        var sp = Math.hypot(m.vx, m.vy);
        var tx = m.x - (m.vx / sp) * m.len, ty = m.y - (m.vy / sp) * m.len;
        var g = ctx.createLinearGradient(tx, ty, m.x, m.y);
        g.addColorStop(0, "rgba(200,220,255,0)");
        g.addColorStop(1, "rgba(255,255,255,1)");
        ctx.globalAlpha = Math.sin(Math.PI * Math.min(1, m.life / m.max));
        ctx.strokeStyle = g; ctx.lineWidth = 1.8 * dpr; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(m.x, m.y); ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(m.x, m.y, 1.6 * dpr, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }

      var t0 = performance.now(), last = t0, nextComet = 1.2, nextMeteor = 4;

      function frame(now) {
        var t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        ctx.globalAlpha = 1;
        ctx.drawImage(milky, 0, 0);
        drawStars(t);
        drawSparkles(t);

        if (t > nextComet && comets.length < 2) { spawnComet(); nextComet = t + 9 + Math.random() * 9; }
        if (t > nextMeteor) { spawnMeteor(false); nextMeteor = t + 4 + Math.random() * 6; }

        comets = comets.filter(function (c) {
          c.x += c.vx * dt; c.y += c.vy * dt;
          drawComet(c);
          return c.x > -c.len * 1.3 && c.x < W + c.len * 1.3 && c.y < H + c.len;
        });
        meteors = meteors.filter(function (m) {
          m.x += m.vx * dt; m.y += m.vy * dt; m.life += dt;
          drawMeteor(m);
          return m.life < m.max;
        });
        requestAnimationFrame(frame);
      }

      function still() {
        ctx.globalAlpha = 1;
        ctx.drawImage(milky, 0, 0);
        drawStars(0);
        drawSparkles(0);
      }

      build();
      if (reduce) still(); else requestAnimationFrame(frame);

      var rt;
      window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(function () { build(); if (reduce) still(); }, 150);
      });

      /* The wish button sends a bright shooting star across the sky */
      var btn = document.getElementById("wish-btn");
      var note = document.getElementById("wish-note");
      btn.addEventListener("click", function () {
        note.textContent = "Wish sent. Keep it a secret.";
        if (reduce) return;
        spawnMeteor(true);
      });
    })();
  </script>
</body>
</html>
