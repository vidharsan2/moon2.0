<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>The Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="fx.js"></script>
<style>
  :root {
    --ink: #050816;
    --white: #ffffff;
    --silver: #dfe6f5;
    --haze: #9fb4dc;
    --gold: #e8bd62;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(120% 90% at 50% 112%, #17418c 0%, #0a1a42 36%, #050816 80%);
    color: var(--silver);
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; z-index: 0; }
  #dust  { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 44%, transparent 52%, rgba(2, 5, 18, .62) 100%);
  }
  body.no3d #stage { display: none; }

  /* ---------- the glowing crescent (loader + fallback) ---------- */
  .crescent {
    --s: clamp(120px, 26vmin, 230px);
    width: var(--s); height: var(--s);
    transform: translateX(calc(var(--s) * .28)) rotate(-18deg);
    filter: drop-shadow(0 0 12px rgba(190, 212, 255, .6)) drop-shadow(0 0 46px rgba(110, 150, 255, .38));
    animation: breathe 4.6s ease-in-out infinite alternate;
  }
  .crescent i {
    display: block; width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 26% 42%, #fffaf0 0%, #ebe4d0 55%, #bfb7a2 100%);
    -webkit-mask-image: radial-gradient(circle at 70% 38%, transparent 0, transparent calc(var(--s) * .54), #000 calc(var(--s) * .545));
            mask-image: radial-gradient(circle at 70% 38%, transparent 0, transparent calc(var(--s) * .54), #000 calc(var(--s) * .545));
  }
  @keyframes breathe { from { opacity: .78; } to { opacity: 1; } }

  /* ---------- text over the scene ---------- */
  #eyebrow {
    position: fixed; z-index: 3; left: 0; right: 0;
    top: max(20px, env(safe-area-inset-top));
    padding: 0 68px; text-align: center;
    font-size: clamp(.74rem, 1.7vw, .92rem); font-weight: 600;
    letter-spacing: .44em; text-transform: uppercase;
    color: var(--silver);
    text-shadow: 0 0 14px rgba(140, 170, 255, .45);
    opacity: 0; transform: translateY(-6px);
    transition: opacity 1.8s ease, transform 1.8s ease;
    pointer-events: none;
  }
  #eyebrow.show { opacity: .9; transform: none; }

  #caption {
    position: fixed; z-index: 3; left: 0; right: 0;
    bottom: max(30px, env(safe-area-inset-bottom));
    padding: 0 24px; text-align: center;
    font-size: clamp(1.3rem, 3vw, 1.95rem);
    font-style: italic; font-weight: 600; letter-spacing: .02em; line-height: 1.3;
    color: var(--white);                                   /* bright white for visibility */
    text-shadow: 0 0 22px rgba(150, 182, 255, .6), 0 1px 3px rgba(0, 0, 0, .85), 0 0 2px rgba(0, 0, 0, .7);
    pointer-events: none;
    transition: opacity .9s ease;
  }
  #caption.hide { opacity: 0; }

  /* ---------- loader ---------- */
  #loading {
    position: fixed; inset: 0; z-index: 8; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 112%, #17418c 0%, #0a1a42 36%, #050816 80%);
    transition: opacity .9s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  .loaderBox { display: grid; justify-items: center; gap: 28px; padding: 24px; }
  #loadText { font-size: 1.35rem; font-style: italic; color: var(--silver); letter-spacing: .03em; }
  .bar { width: min(62vw, 240px); height: 2px; border-radius: 2px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7f9fff, #fff); transition: width .25s ease; }

  /* ---------- fallback when 3D is not available ---------- */
  #fallback {
    position: fixed; inset: 0; z-index: 3; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding-bottom: 14vh;
  }
  body.no3d #fallback { display: flex; }
  .cta {
    font: inherit; font-size: 1.2rem; font-weight: 600; cursor: pointer;
    min-height: 48px; padding: 11px 26px; border-radius: 999px;
    color: #1a1405; background: var(--gold); border: 1px solid var(--gold);
    box-shadow: 0 8px 30px rgba(232, 189, 98, .28);
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .cta:hover { background: #f3cd7c; transform: translateY(-2px); box-shadow: 0 12px 36px rgba(232, 189, 98, .4); }
  .cta:active { transform: none; }
  .cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

  /* ---------- the reveal card ---------- */
  #found {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 6;
    width: min(92vw, 440px); max-height: calc(100dvh - 48px); overflow: auto;
    padding: 28px 26px 22px;
    border: 1px solid rgba(232, 189, 98, .5);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(14, 22, 48, .86), rgba(6, 10, 26, .9));
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 20px 70px rgba(0, 0, 0, .55), 0 0 60px rgba(120, 150, 255, .12);
    text-align: center;
    transform: translate(-50%, 28px) scale(.98);
    opacity: 0; visibility: hidden;
    transition: opacity .7s ease, transform .7s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .7s;
  }
  #found.show { opacity: 1; visibility: visible; transform: translate(-50%, 0) scale(1); transition-delay: 0s; }
  #found h2 { font-weight: 600; font-size: 2rem; line-height: 1.15; color: var(--white); }
  #found p { margin-top: 6px; color: var(--silver); font-size: 1.2rem; font-style: italic; }
  #pw {
    display: block; margin: 16px 0 18px; padding: 12px 10px;
    border-radius: 14px; background: rgba(232, 189, 98, .1); border: 1px solid rgba(232, 189, 98, .22);
    font-size: clamp(1.7rem, 6.4vw, 2.4rem); font-weight: 600; letter-spacing: .14em;
    color: var(--gold); word-break: break-all; user-select: all; -webkit-user-select: all;
    text-shadow: 0 0 22px rgba(232, 189, 98, .35);
  }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .row button, .row a {
    font: inherit; font-size: 1.15rem; color: var(--white); text-decoration: none; cursor: pointer;
    min-height: 46px; display: inline-flex; align-items: center; justify-content: center;
    padding: 9px 22px; border-radius: 14px; border: 1px solid rgba(223, 230, 245, .4); background: transparent;
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .row a { background: var(--gold); color: #1a1405; border-color: var(--gold); font-weight: 600; }
  .row button:hover { background: rgba(223, 230, 245, .12); }
  .row a:hover { background: #f3cd7c; transform: translateY(-1px); }
  .row button:active, .row a:active { transform: scale(.97); }
  .row button:focus-visible, .row a:focus-visible, #closeFound:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
  #closeFound {
    position: absolute; top: 8px; right: 10px; width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: transparent; color: var(--silver); font-size: 1.5rem; line-height: 1; cursor: pointer;
  }
  #closeFound:hover { color: var(--white); background: rgba(255, 255, 255, .08); }

  @media (max-width: 520px) {
    #eyebrow { font-size: .7rem; letter-spacing: .3em; padding: 0 62px; text-wrap: balance; }
  }
  @media (min-width: 768px) { #found { width: 470px; } }
  @media (max-height: 500px) and (orientation: landscape) {
    #found { padding: 16px 20px 14px; bottom: 10px; }
    #found h2 { font-size: 1.45rem; }
    #found p { font-size: 1rem; }
    #pw { margin: 8px 0 10px; padding: 6px; font-size: 1.5rem; }
    #caption { font-size: 1.15rem; bottom: 12px; }
    #eyebrow { top: 10px; }
    .crescent { --s: 90px; }
    #fallback { gap: 18px; padding-bottom: 8vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .crescent { animation: none; }
    #eyebrow, #caption, #found, #loading { transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<canvas id="stage" tabindex="0" aria-label="A 3D moon. Touch it to explore. Press Enter to begin."></canvas>
<canvas id="dust" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>

<p id="eyebrow"></p>
<p id="caption" class="hide" aria-live="polite"></p>

<div id="loading" role="status">
  <div class="loaderBox">
    <div class="crescent" aria-hidden="true"><i></i></div>
    <span id="loadText">Gathering moonlight…</span>
    <div class="bar" aria-hidden="true"><i id="loadBar"></i></div>
  </div>
</div>

<div id="fallback">
  <div class="crescent" aria-hidden="true"><i></i></div>
  <button id="reveal" class="cta" type="button">Show me what the moon is hiding</button>
</div>

<section id="found" role="dialog" aria-labelledby="foundTitle">
  <button id="closeFound" type="button" aria-label="Keep exploring">&times;</button>
  <h2 id="foundTitle">You found him.</h2>
  <p>He was carrying the password:</p>
  <output id="pw" aria-live="off"></output>
  <div class="row">
    <button id="copy" type="button">Copy</button>
    <a id="go" href="password.html">Open the next page</a>
  </div>
</section>

<noscript><p style="position:fixed;inset:auto 0 40px;text-align:center;color:#fff;font-size:1.3rem">This page needs JavaScript to show the moon.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   SETTINGS — change these
   ============================================================ */
const CONFIG = {
  // The password shown here is read straight from config.js (the "pin" value)
  // so you only ever have to set it in ONE place. No need to edit it here.
  password: (window.CAPSULE && window.CAPSULE.pin) || "0000",

  // The page the "Open the next page" button goes to
  nextPage: "password.html",

  // Where the astronaut stands, in degrees.
  // lat: -90 (south pole) … 90 (north pole)
  // lon: 0 = the face you see first, 180 = the far side
  astronaut: { lat: -28, lon: 132 },

  // Optional: a real moon photo-map (equirectangular, e.g. "moon.jpg").
  // Leave "" to use the moon generated by this page.
  moonTexture: "",

  // Small title at the top of the screen. Use "" to hide it.
  eyebrow: "A message from the moon",

  // Story lines shown one after another before the "Touch the moon." prompt.
  // Use [] to skip the story.
  story: [
    "Every night, the moon keeps one secret.",
    "Tonight, it chose to trust you with it."
  ],
  introCaption: "Touch the moon.",
  exploreCaption: "Drag to turn it. Scroll or pinch to zoom. Someone is standing up there.",

  // If she hasn't found him after this many seconds, show this gentle hint ("" = no hint)
  hint: "Look closer… something small is waving back at you.",
  hintAfterSeconds: 18,

  // How far the camera moves in when the moon is touched.
  // 1 = no zoom at all, 0.84 = subtle (default), 0.5 = dramatic.
  clickZoom: 0.84,

  // Shown only on devices that cannot draw the 3D moon
  fallbackCaption: "Your device couldn't draw the 3D moon, but the secret is still yours.",

  // Texture size for the generated moon. Bigger = sharper but slower to prepare.
  // (Phones automatically use a smaller size so the page opens faster.)
  textureWidth: 1536
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const fx = window.FX || { muted: false, sfx() {}, start() {}, go(u) { location.href = u; } };   // page still works if fx.js is missing

const captionEl = $('caption'), eyebrowEl = $('eyebrow');
const foundEl = $('found'), pwEl = $('pw'), goEl = $('go'), copyEl = $('copy'), closeEl = $('closeFound');

function webglOK() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch (e) { return false; }
}
const NO3D = typeof THREE === 'undefined' || !THREE.OrbitControls || !webglOK() || params.has('no3d');

/* ---------- captions + story ---------- */
let capToken = 0;
function setCaption(text) {
  const mine = ++capToken;
  captionEl.classList.add('hide');
  setTimeout(() => {
    if (mine !== capToken) return;
    captionEl.textContent = text || '';
    if (text) captionEl.classList.remove('hide');
  }, text ? 450 : 0);
}
const storyTimers = [];
function cancelStory() { storyTimers.splice(0).forEach(clearTimeout); }
function playStory(finalText) {
  cancelStory();
  const lines = (CONFIG.story || []).filter(Boolean);
  let t = 500;
  lines.forEach((line) => { storyTimers.push(setTimeout(() => setCaption(line), t)); t += 3500; });
  storyTimers.push(setTimeout(() => setCaption(finalText), t));
}

/* ---------- the reveal card ---------- */
let onFoundClosed = null, revealTimer = 0, copyTimer = 0;
function revealPassword() {
  const target = String(CONFIG.password);
  clearInterval(revealTimer);
  if (reduceMotion || target.length > 24) { pwEl.textContent = target; return; }
  const glyphs = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ*+';
  const t0 = performance.now(), dur = 1100;
  revealTimer = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / dur), fixed = Math.floor(p * target.length);
    let s = target.slice(0, fixed);
    for (let i = fixed; i < target.length; i++) s += target[i] === ' ' ? ' ' : glyphs[Math.floor(Math.random() * glyphs.length)];
    pwEl.textContent = s;
    if (p >= 1) { clearInterval(revealTimer); pwEl.textContent = target; }
  }, 45);
}
function showFound() {
  cancelStory();
  capToken++; captionEl.classList.add('hide');
  foundEl.classList.add('show');
  fx.sfx('found');
  revealPassword();
  setTimeout(() => { try { copyEl.focus({ preventScroll: true }); } catch (e) {} }, 700);
}
function hideFound() {
  if (!foundEl.classList.contains('show')) return;
  foundEl.classList.remove('show');
  clearInterval(revealTimer); pwEl.textContent = CONFIG.password;
  fx.sfx('ui');
  if (onFoundClosed) onFoundClosed();
}
closeEl.addEventListener('click', hideFound);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideFound(); });

async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {                                                  // older browsers / file:// pages
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
copyEl.addEventListener('click', async () => {
  const ok = await copyText(String(CONFIG.password));
  if (!ok) {                                             // last resort: select it so she can press Ctrl+C / long-press
    const r = document.createRange(); r.selectNodeContents(pwEl);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  copyEl.textContent = ok ? 'Copied' : 'Select and copy';
  fx.sfx(ok ? 'copy' : 'ui');
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => (copyEl.textContent = 'Copy'), 1800);
});

goEl.href = CONFIG.nextPage;
goEl.addEventListener('click', (e) => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  fx.sfx('tap');
  fx.go(CONFIG.nextPage);
});

eyebrowEl.textContent = CONFIG.eyebrow || '';

/* ---------- shooting stars (and a static sky when 3D is unavailable) ---------- */
(function sky2d() {
  const cv = $('dust'), g = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, stars = [], shoot = null, next = performance.now() + 5000 + Math.random() * 5000;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = Math.round(innerWidth * dpr); H = cv.height = Math.round(innerHeight * dpr);
    stars = [];
    if (NO3D) {
      const n = Math.round(innerWidth * innerHeight / 5200);
      for (let i = 0; i < n; i++) stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: (Math.random() < 0.08 ? 1.6 : 0.6 + Math.random() * 0.8) * dpr,
        a: 0.25 + Math.random() * 0.65, s: 0.0006 + Math.random() * 0.002, p: Math.random() * 6.28
      });
      if (reduceMotion) drawStars(0);
    }
  }
  function drawStars(now) {
    g.fillStyle = '#e8eeff';
    for (const s of stars) {
      g.globalAlpha = reduceMotion ? s.a : s.a * (0.65 + 0.35 * Math.sin(now * s.s + s.p));
      g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.2832); g.fill();
    }
    g.globalAlpha = 1;
  }
  function launch(now) {
    const dir = Math.random() < 0.5 ? 1 : -1, ang = Math.PI * (0.14 + Math.random() * 0.12);
    shoot = {
      x: (dir > 0 ? 0.05 + Math.random() * 0.45 : 0.5 + Math.random() * 0.45) * W, y: (0.04 + Math.random() * 0.32) * H,
      vx: dir * Math.cos(ang), vy: Math.sin(ang), t0: now, dur: 850 + Math.random() * 450,
      len: (0.1 + Math.random() * 0.08) * Math.max(W, H), speed: (0.9 + Math.random() * 0.6) * Math.max(W, H)
    };
  }
  function drawShoot(now) {
    const p = (now - shoot.t0) / shoot.dur;
    if (p >= 1) { shoot = null; return; }
    const d = shoot.speed * (now - shoot.t0) / 1000, hx = shoot.x + shoot.vx * d, hy = shoot.y + shoot.vy * d;
    const tx = hx - shoot.vx * shoot.len, ty = hy - shoot.vy * shoot.len, fade = Math.sin(p * Math.PI);
    const lg = g.createLinearGradient(tx, ty, hx, hy);
    lg.addColorStop(0, 'rgba(170,200,255,0)'); lg.addColorStop(1, 'rgba(255,255,255,' + (0.9 * fade).toFixed(3) + ')');
    g.strokeStyle = lg; g.lineWidth = 1.6 * dpr; g.lineCap = 'round';
    g.beginPath(); g.moveTo(tx, ty); g.lineTo(hx, hy); g.stroke();
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    const busy = (NO3D && !reduceMotion) || shoot;
    if (!busy && now < next) return;
    if (!shoot && now >= next && !reduceMotion) { launch(now); next = now + 7000 + Math.random() * 9000; }
    g.clearRect(0, 0, W, H);
    if (NO3D) drawStars(now);
    if (shoot) drawShoot(now);
  }
  let rz = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(size); });
  size();
  requestAnimationFrame(frame);
})();

/* ---------- no 3D? still let her through ---------- */
function startFallback() {
  if (document.body.classList.contains('no3d')) return;
  document.body.classList.add('no3d');
  const l = $('loading'); if (l) { l.classList.add('done'); setTimeout(() => l.remove(), 900); }
  eyebrowEl.classList.add('show');
  CONFIG.story = (CONFIG.story || []);
  playStory(CONFIG.fallbackCaption);
  onFoundClosed = () => setCaption(CONFIG.fallbackCaption);
}
$('reveal').addEventListener('click', () => { fx.start(); fx.sfx('tap'); showFound(); });
if (NO3D) startFallback();
</script>
<script>
(function () {
if (NO3D) return;                                    // fallback mode is already running

const R = 5;                                         // moon radius in scene units
const canvas = $('stage');
const loadingEl = $('loading'), loadText = $('loadText'), loadBar = $('loadBar');
const small = Math.min(window.innerWidth, window.innerHeight) < 700;
const lite = params.has('lite');

/* ---------- renderer / scene ---------- */
let renderer, lostTimer = 0;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: !small, powerPreference: 'high-performance' });
} catch (e) { startFallback(); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, small ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x050816);
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); lostTimer = setTimeout(startFallback, 4000); });
canvas.addEventListener('webglcontextrestored', () => clearTimeout(lostTimer));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 1200);

/* deep-blue galaxy backdrop: gradient, a soft milky band, dust lanes and nebula glows */
(function makeBackdrop() {
  const w = 1024, h = 512, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#040716'); g.addColorStop(0.55, '#0a1a42'); g.addColorStop(1, '#16397f');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.save(); x.translate(w * 0.5, h * 0.5); x.rotate(-0.5);
  for (let i = 0; i < 90; i++) {
    const px = (Math.random() * 2 - 1) * w * 0.7, py = (Math.random() + Math.random() - 1) * h * 0.16, r = 60 + Math.random() * 130;
    const gr = x.createRadialGradient(px, py, 0, px, py, r);
    gr.addColorStop(0, Math.random() < 0.25 ? 'rgba(255,214,180,0.05)' : 'rgba(140,165,255,0.065)');
    gr.addColorStop(1, 'rgba(90,110,220,0)');
    x.fillStyle = gr; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  for (let i = 0; i < 24; i++) {
    const px = (Math.random() * 2 - 1) * w * 0.55, py = (Math.random() * 2 - 1) * h * 0.08, r = 25 + Math.random() * 60;
    const gr = x.createRadialGradient(px, py, 0, px, py, r);

/* ============================================================
   Procedural moon surface
   (maria, thousands of craters at 7 sizes, rims, ejecta, regolith)
   ============================================================ */
function hash(x, y, z, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177) + Math.imul(s, 2147483629)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = Math.imul(h ^ (h >>> 16), 2246822519);
  h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let fx = x - ix, fy = y - iy, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iy, iz, 1), b = hash(ix + 1, iy, iz, 1), c = hash(ix, iy + 1, iz, 1), d = hash(ix + 1, iy + 1, iz, 1);
  const e = hash(ix, iy, iz + 1, 1), f = hash(ix + 1, iy, iz + 1, 1), g = hash(ix, iy + 1, iz + 1, 1), h = hash(ix + 1, iy + 1, iz + 1, 1);
  const x1 = a + (b - a) * fx, x2 = c + (d - c) * fx, x3 = e + (f - e) * fx, x4 = g + (h - g) * fx;
  const y1 = x1 + (x2 - x1) * fy, y2 = x3 + (x4 - x3) * fy;
  return y1 + (y2 - y1) * fz;
}
function fbm(x, y, z, oct) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x, y, z); n += a; x *= 2.03; y *= 2.03; z *= 2.03; a *= 0.5; }
  return s / n;
}
function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

function generateMoon(W, onProgress, onDone) {
  const H = W >> 1;
  const colorCv = document.createElement('canvas'); colorCv.width = W; colorCv.height = H;
  const bumpCv = document.createElement('canvas'); bumpCv.width = W; bumpCv.height = H;
  const cctx = colorCv.getContext('2d'), bctx = bumpCv.getContext('2d');
  const cimg = cctx.createImageData(W, H), bimg = bctx.createImageData(W, H);
  const cd = cimg.data, bd = bimg.data;

  const F = [3, 6, 11, 20, 36, 64, 110];
  const O = F.map((_, k) => [k * 17.3 + 0.5, k * 5.1 + 2.2, k * 11.7 + 7.9]);
  let row = 0;

  function chunk() {
    const t0 = performance.now();
    for (; row < H && performance.now() - t0 < 12; row++) {
      const th = (row + 0.5) / H * Math.PI, sT = Math.sin(th), cT = Math.cos(th);
      for (let col = 0; col < W; col++) {
        const ph = (col + 0.5) / W * Math.PI * 2;
        // same mapping as THREE.SphereGeometry
        const px = -Math.cos(ph) * sT, py = cT, pz = Math.sin(ph) * sT;

        // maria: dark basalt plains, mostly on the face we see first (+z)
        const w = smooth(-0.3, 0.6, pz);
        const m = fbm(px * 1.7 + 3.1, py * 1.7 + 7.7, pz * 1.7 + 1.3, 4);
        const mare = smooth(0.53, 0.58, m + 0.2 * (w - 1));

        let h = (fbm(px * 5 + 11, py * 5 + 2, pz * 5 + 9, 4) - 0.5) * 0.006 - 0.0015 * mare;
        let bright = 0;
        const cs = 1 - 0.7 * mare;       // lava-flooded craters are shallower

        for (let k = 0; k < F.length; k++) {
          const f = F[k], o = O[k];
          const qx = px * f + o[0], qy = py * f + o[1], qz = pz * f + o[2];
          const ix = Math.floor(qx), iy = Math.floor(qy), iz = Math.floor(qz);
          for (let j = 0; j < 3; j++) {
            const s = (k * 3 + j) * 8;
            if (hash(ix, iy, iz, s) > 0.78) continue;
            const cx = ix + 0.34 + 0.32 * hash(ix, iy, iz, s + 1);
            const cy = iy + 0.34 + 0.32 * hash(ix, iy, iz, s + 2);
            const cz = iz + 0.34 + 0.32 * hash(ix, iy, iz, s + 3);
            const rad = 0.06 + 0.16 * Math.pow(hash(ix, iy, iz, s + 4), 1.5);
            const dx = qx - cx, dy = qy - cy, dz = qz - cz;
            const d2 = dx * dx + dy * dy + dz * dz, lim = 1.4 * rad;
            if (d2 > lim * lim) continue;
            const d = Math.sqrt(d2) / rad, rr = rad / f;
            if (d < 1) {
              h -= (1 - d * d) * 0.22 * rr * cs;                         // bowl
              if (k < 3) h += 0.05 * rr * Math.exp(-(d * d) / 0.02) * cs; // central peak
            }
            const rim = Math.exp(-Math.pow((d - 1.03) / 0.17, 2));
            h += 0.10 * rr * rim * cs;                                   // raised rim
            bright += 0.07 * rim;
            if (hash(ix, iy, iz, s + 5) > 0.85) bright += 0.10 * Math.max(0, 1.4 - d); // fresh, bright ejecta
          }
        }
        bright *= (1 - 0.5 * mare);

        const aHigh = 0.62 + (fbm(px * 9 + 5, py * 9 + 1, pz * 9 + 8, 3) - 0.5) * 0.24;
        const aMare = 0.30 + (fbm(px * 7 + 2, py * 7 + 6, pz * 7 + 3, 3) - 0.5) * 0.10;
        let a = aHigh + (aMare - aHigh) * mare + bright;
        a = Math.min(1, Math.max(0, a));

        const i4 = (row * W + col) * 4;
        cd[i4]     = a * (1.00 - 0.04 * mare) * 255;
        cd[i4 + 1] = a * 0.975 * 255;
        cd[i4 + 2] = a * (0.93 + 0.07 * mare) * 255;
        cd[i4 + 3] = 255;

        const v = (0.5 + 0.5 * Math.tanh(h * 80)) * 255;
        bd[i4] = bd[i4 + 1] = bd[i4 + 2] = v; bd[i4 + 3] = 255;
      }
    }
    onProgress(row / H);
    if (row < H) { setTimeout(chunk, 0); }
    else {
      cctx.putImageData(cimg, 0, 0); bctx.putImageData(bimg, 0, 0);
      onDone(colorCv, bumpCv);
    }
  }
  chunk();
}

/* tileable fine-grain noise, laid over the surface for close-up regolith */
function makeDetailTexture() {
  const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N);
  const periods = [8, 16, 32, 64], lattices = periods.map((p, i) => {
    const l = new Float32Array(p * p); for (let k = 0; k < l.length; k++) l[k] = Math.random(); return l;
  });
  function pn(l, p, x, y) {
    const fx = x * p, fy = y * p, ix = Math.floor(fx), iy = Math.floor(fy);
    let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const x0 = ix % p, y0 = iy % p, x1 = (ix + 1) % p, y1 = (iy + 1) % p;
    const a = l[y0 * p + x0], b = l[y0 * p + x1], c = l[y1 * p + x0], d = l[y1 * p + x1];
    return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let s = 0, amp = 0.5, n = 0;
    periods.forEach((p, i) => { s += amp * pn(lattices[i], p, x / N, y / N); n += amp; amp *= 0.6; });
    const v = (s / n) * 255, i4 = (y * N + x) * 4;
    img.data[i4] = img.data[i4 + 1] = img.data[i4 + 2] = v; img.data[i4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);

  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/* ============================================================

  const wave = add(new THREE.CylinderGeometry(0.0125, 0.0125, 0.05, 10), suit, -0.052, 0.14, 0, 0, 0, 2.5);

  const v = add(new THREE.SphereGeometry(0.023, 20, 14), visor, 0, 0.169, 0.016); v.scale.set(1, 0.9, 0.8);

  figure.rotation.y = 0.7;

  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, 0.2, 8), poleMat);
  pole.position.set(0.13, 0.1, 0.02); holder.add(pole);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.09, 0.055),

  const gc = document.createElement('canvas'); gc.width = gc.height = 128;
  const gx = gc.getContext('2d');

  const glint = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(gc), blending: THREE.AdditiveBlending, transparent: true, opacity: 0, depthWrite: false
  }));
  glint.position.set(0.04, 0.2, 0); holder.add(glint);

/* ============================================================
   Build the moon once its surface is ready
   ============================================================ */
let moon, hitbox, glint;
let detailTex;

function buildMoon(map, bump, bumpScale) {
  map.encoding = THREE.sRGBEncoding;
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();
  bump.anisotropy = map.anisotropy;
  detailTex = makeDetailTexture();

  const mat = new THREE.MeshStandardMaterial({ map, bumpMap: bump, bumpScale, roughness: 1, metalness: 0 });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.detailMap = { value: detailTex };
    sh.fragmentShader = 'uniform sampler2D detailMap;\n' + sh.fragmentShader.replace(
      '#include <map_fragment>',
      '#include <map_fragment>\n float dn = texture2D(detailMap, vUv * vec2(60.0, 30.0)).r;\n diffuseColor.rgb *= 0.78 + 0.44 * dn;'
    );
  };
  moon = new THREE.Mesh(new THREE.SphereGeometry(R, small ? 96 : 128, small ? 72 : 96), mat);
  moonGroup.add(moon);

  // place the astronaut
  const lat = THREE.MathUtils.degToRad(CONFIG.astronaut.lat), lon = THREE.MathUtils.degToRad(CONFIG.astronaut.lon);
  const dir = new THREE.Vector3(Math.sin(lon) * Math.cos(lat), Math.sin(lat), Math.cos(lon) * Math.cos(lat)).normalize();
  const a = buildAstronaut();
  a.holder.position.copy(dir).multiplyScalar(R);
  a.holder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  moonGroup.add(a.holder);
  hitbox = a.hit; glint = a.glint;

  start();
}

/* ============================================================
   Interaction + state
   ============================================================ */
let state = 'intro';           // intro → flying → explore → found
let introDist = 18;
const controls = new THREE.OrbitControls(camera, canvas);
controls.enabled = false;
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomSpeed = 0.7;
controls.minDistance = R + 0.7;
controls.autoRotateSpeed = 0.35;

function fitDistance() {
  const halfV = THREE.MathUtils.degToRad(camera.fov / 2);
  const halfH = Math.atan(Math.tan(halfV) * camera.aspect);
  return R / Math.sin(Math.min(halfV, halfH) * 0.78);
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  introDist = fitDistance();
  controls.maxDistance = Math.max(introDist, 16);
  if (state === 'intro') { camera.position.set(0, 0, introDist); camera.lookAt(0, 0, 0); }
}
let rzFrame = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rzFrame); rzFrame = requestAnimationFrame(resize); });
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
resize();

function flyTo(dist, ms, done) {
  const from = camera.position.length(), t0 = performance.now(), dur = reduceMotion ? 0 : ms;
  (function step(now) {
    const t = dur ? Math.min(1, (now - t0) / dur) : 1;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * t);                // easeInOutSine: gentle in, gentle out
    camera.position.set(0, 0, from + (dist - from) * e);
    camera.lookAt(0, 0, 0);
    if (t < 1) requestAnimationFrame(step); else done();
  })(t0);
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects([moon, hitbox], false)[0];
}

// is the astronaut on the side of the moon we can currently see?
const tmpV = new THREE.Vector3(), camV = new THREE.Vector3();
function facing() {
  hitbox.getWorldPosition(tmpV); tmpV.normalize();
  camV.copy(camera.position).normalize();
  return smooth(0.02, 0.3, tmpV.dot(camV));
}

let hintTimer = 0, autoTimer = 0;
function armHint() {
  clearTimeout(hintTimer);
  if (!CONFIG.hint) return;
  hintTimer = setTimeout(() => { if (state === 'explore') setCaption(CONFIG.hint); }, (CONFIG.hintAfterSeconds || 18) * 1000);
}

function enterExplore() {
  if (state !== 'intro') return;
  state = 'flying';
  cancelStory(); setCaption('');
  fx.start(); fx.sfx('tap'); fx.sfx('whoosh');
  sunTarget.x = -9; sunTarget.y = 4; sunTarget.z = 7;          // the moon "wakes up"
  const target = Math.max(controls.minDistance + 1, introDist * Math.min(1, Math.max(0.4, CONFIG.clickZoom)));
  flyTo(target, 1700, () => {
    controls.target.set(0, 0, 0);
    controls.enabled = true; controls.update();
    controls.autoRotate = !reduceMotion;
    state = 'explore';
    setCaption(CONFIG.exploreCaption);
    armHint();
  });
}

function foundHim() {
  state = 'found';
  clearTimeout(hintTimer); clearTimeout(autoTimer);
  controls.autoRotate = false;
  showFound();
}
onFoundClosed = () => {
  if (state !== 'found') return;
  state = 'explore';
  setCaption(CONFIG.exploreCaption);
  armHint();
};

controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(autoTimer); });
controls.addEventListener('end', () => {
  clearTimeout(autoTimer);
  if (!reduceMotion) autoTimer = setTimeout(() => { if (state === 'explore') controls.autoRotate = true; }, 5000);
});

let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || !moon) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 600;
  down = null;
  if (moved > 8 || !quick) return;
  const hit = pick(e);
  if (!hit) return;
  if (state === 'intro') enterExplore();
  else if (state === 'explore' && hit.object === hitbox && facing() > 0.05) foundHim();
});
canvas.addEventListener('pointermove', (e) => {
  if (!moon || e.buttons) return;
  const hit = pick(e);
  const onHim = hit && hit.object === hitbox && facing() > 0.05;
  canvas.style.cursor = hit && (state === 'intro' || (state === 'explore' && onHim)) ? 'pointer' : (state === 'explore' ? 'grab' : 'default');
});
canvas.addEventListener('keydown', (e) => {                    // keyboard: Enter / Space starts the journey
  if ((e.key === 'Enter' || e.key === ' ') && state === 'intro' && moon) { e.preventDefault(); enterExplore(); }
});

/* ---------- main loop ---------- */
function animate(now) {
  requestAnimationFrame(animate);
  if (document.hidden) return;
  if (state === 'intro' && !reduceMotion) moonGroup.rotation.y += 0.0012;

  sun.position.x += (sunTarget.x - sun.position.x) * 0.025;
  sun.position.y += (sunTarget.y - sun.position.y) * 0.025;
  sun.position.z += (sunTarget.z - sun.position.z) * 0.025;

  const dist = camera.position.length();
  if (controls.enabled) {
    // turn more gently the closer you are to the surface
    controls.rotateSpeed = Math.min(1, Math.max(0.12, (dist - R) / (R * 1.4)));
    controls.update();
  }
  const haloTarget = state === 'intro' ? 0.6 : 0.2;
  halo.material.opacity += (haloTarget - halo.material.opacity) * 0.05;
  bloom.material.opacity += ((state === 'intro' ? 0.5 : 0.28) - bloom.material.opacity) * 0.05;
  if (!reduceMotion) starMats[1].mat.opacity = starMats[1].base * (0.82 + 0.18 * Math.sin(now * 0.0013));

  // astronaut: the click target grows with distance (easy to tap on phones); the glint pulses
  if (hitbox) {
    const k = Math.max(1, (dist - R) / 2.2);
    hitbox.scale.set(k, k, k);
    if (state === 'explore') {
      const f = facing(), s = Math.max(0.35, (dist - R) * 0.09);
      glint.scale.set(s, s, 1);
      glint.material.opacity = f * (0.5 + 0.4 * Math.sin(now * 0.003));
    } else {
      glint.material.opacity = 0;
    }
  }
  renderer.render(scene, camera);
}

function start() {
  loadBar.style.width = '100%';
  loadingEl.classList.add('done');
  setTimeout(() => loadingEl.remove(), 900);
  eyebrowEl.classList.add('show');
  playStory(CONFIG.introCaption);
  requestAnimationFrame(animate);
}

if (params.has('debug')) {
  window.__moon = { state: () => state, dist: () => camera.position.length(), introDist: () => introDist, facing, sun: () => sun.position.x };
}

/* ---------- boot: real texture if given, otherwise generate ---------- */
function pickWidth() {
  if (lite) return 640;
  let w = CONFIG.textureWidth;
  const mem = navigator.deviceMemory || 8, cores = navigator.hardwareConcurrency || 8;
  if (small || mem <= 4 || cores <= 4) w = Math.min(w, 1024);     // phones open faster
  return w;
}
function makeProcedural() {
  generateMoon(pickWidth(),
    (p) => { loadText.textContent = 'Gathering moonlight… ' + Math.round(p * 100) + '%'; loadBar.style.width = (p * 100) + '%'; },
    (colorCv, bumpCv) => {
      // bump heights were encoded so that 1 unit of bumpScale ≈ the moon's radius ÷ 40
      buildMoon(new THREE.CanvasTexture(colorCv), new THREE.CanvasTexture(bumpCv), 0.2);
    });
}
if (CONFIG.moonTexture) {
  new THREE.TextureLoader().load(CONFIG.moonTexture,
    (tex) => buildMoon(tex, tex, 0.12),
    undefined,
    () => makeProcedural());
} else {
  setTimeout(makeProcedural, 60);
}
})();
</script>
</body>
