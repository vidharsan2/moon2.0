<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locked</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <script src="fx.js"></script>
  <style>
    :root {
      --night: #0a2540;
      --coral: #ff6b8b;
      --butter: #ffe29a;
      --mint: #7fe5c4;
      --snow: #fff8f0;
      --snow-dim: #b9c7dc;
      --display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
      --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { background: var(--night); color: var(--snow); -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: var(--body);
      font-size: 1.1rem;
      line-height: 1.5;
      background:
        radial-gradient(38% 28% at 84% 10%, rgba(190, 212, 255, 0.18) 0%, transparent 72%),
        radial-gradient(80% 55% at 50% 105%, #2a6bb0 0%, transparent 70%),
        radial-gradient(60% 45% at 50% -5%, #1b3f73 0%, transparent 70%),
        var(--night);
    }

    #stars { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

    .eyebrow {
      margin: 0 0 1.4rem;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.38em; text-transform: uppercase;
      color: var(--snow-dim); text-shadow: 0 0 14px rgba(140, 170, 255, 0.4);
      opacity: 0; transform: translateY(-4px);
      animation: rise 1.4s ease 0.5s both;
    }
    @keyframes rise { to { opacity: 0.95; transform: none; } }

    .lock .shackle { transition: transform 0.4s ease; }
    body.unlocked .lock .shackle { transform: translateY(-7px); }

    .back {
      display: inline-block; margin-top: 1.6rem; padding: 0.5rem 0.4rem;
      font-size: 0.95rem; color: var(--snow-dim); text-decoration: none;
      border-bottom: 1px solid rgba(185, 199, 220, 0.35);
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .back:hover { color: var(--snow); border-color: var(--snow); }
    .back:focus-visible { outline: 3px solid var(--butter); outline-offset: 4px; }

    main {
      position: relative; z-index: 1;
      width: min(100% - 2.5rem, 28rem);
      padding-block: 3rem;
      text-align: center;
    }

    .lock {
      margin: 0 auto 1.5rem;
      width: clamp(48px, 12vw, 60px);
      height: auto;
      opacity: 0.9;
    }

    h1 {
      margin: 0 0 0.6rem;
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(1.4rem, 5vw, 2rem);
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .sub {
      margin: 0 0 2.25rem;
      color: var(--snow-dim);
    }

    form { display: grid; justify-items: center; gap: 1.5rem; }

    .pin-boxes {
      display: flex;
      gap: clamp(0.5rem, 2.5vw, 0.9rem);
    }

    .pin-boxes input {
      width: clamp(2.6rem, 11vw, 3.4rem);
      height: clamp(3.2rem, 13vw, 4rem);
      text-align: center;
      font-family: var(--display);
      font-size: clamp(1.5rem, 6vw, 2rem);
      color: var(--snow);
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(185, 199, 220, 0.4);
      border-radius: 14px;
      caret-color: var(--coral);
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .pin-boxes input:focus {
      outline: none;
      border-color: var(--coral);
      background: rgba(255, 255, 255, 0.1);
    }

    .shake { animation: shake 0.45s ease; }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-7px); }
      40%, 60% { transform: translateX(7px); }
    }
    .shake input { border-color: var(--coral); }

    .btn {
      display: inline-block;
      padding: 1rem 2.6rem;
      border-radius: 999px;
      background: var(--coral);
      color: var(--night);
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.02rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 107, 139, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(255, 107, 139, 0.5); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 3px solid var(--butter); outline-offset: 4px; }
    .btn[disabled] { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

    .msg { min-height: 1.4em; margin: 0; font-size: 0.95rem; }
    .msg.err { color: var(--coral); }
    .msg.ok { color: var(--mint); }

    body.unlocked main { animation: fade 0.5s ease both; }
    @keyframes fade { from { opacity: 1; } to { opacity: 0; } }

    @media (max-height: 560px) {
      main { padding-block: 0.9rem; }
      .eyebrow { margin-bottom: 0.5rem; }
      .lock { width: 38px; margin-bottom: 0.7rem; }
      h1 { font-size: 1.3rem; margin-bottom: 0.3rem; }
      .sub { margin-bottom: 1rem; font-size: 1rem; }
      form { gap: 0.9rem; }
      .pin-boxes input { height: 2.8rem; }
      .btn { padding: 0.7rem 2rem; }
      .msg { min-height: 1.1em; }
      .back { margin-top: 0.5rem; padding: 0.3rem 0.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
      .btn { transition: none; }
      body.unlocked main { animation: none; }
      .eyebrow { animation: none; opacity: 0.95; transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <main>
    <p class="eyebrow" id="eyebrow">The moon whispered a number</p>
    <svg class="lock" viewBox="0 0 48 56" aria-hidden="true" focusable="false">
      <rect x="1" y="24" width="46" height="31" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path class="shackle" d="M12 24V16a12 12 0 0 1 24 0v8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="24" cy="37" r="4" fill="currentColor"/>
      <rect x="22.4" y="39" width="3.2" height="8" rx="1.4" fill="currentColor"/>
    </svg>

    <h1 id="title">This one needs a PIN</h1>
    <p class="sub" id="sub">Only one person knows it. Ask them.</p>

    <form id="form" autocomplete="off">
      <div class="pin-boxes" id="boxes"></div>
      <p class="msg" id="msg" aria-live="polite"></p>
      <button class="btn" id="go" type="submit" disabled>Unlock</button>
    </form>
    <a class="back" id="back" href="index.html">Lost the number? Back to the moon</a>
  </main>

  <script>
    (function () {
      var C = window.CAPSULE;
      var LEN = (C.pin || "0000").length;
      var boxes = document.getElementById("boxes");
      var form = document.getElementById("form");
      var msg = document.getElementById("msg");
      var go = document.getElementById("go");
      var inputs = [];

      var FX = window.FX || { sfx: function () {}, go: function (u) { location.href = u; } };
      var eyebrow = document.getElementById("eyebrow");
      if (typeof C.pinEyebrow === "string") { eyebrow.textContent = C.pinEyebrow; eyebrow.hidden = !C.pinEyebrow; }

      document.getElementById("title").textContent = C.pinTitle || "This one needs a PIN";
      document.getElementById("sub").textContent = C.pinHint || "Only one person knows it. Ask them.";

      for (var i = 0; i < LEN; i++) {
        var inp = document.createElement("input");
        inp.type = "tel";
        inp.inputMode = "numeric";
        inp.pattern = "[0-9]*";
        inp.maxLength = 1;
        inp.autocomplete = "off";
        inp.setAttribute("aria-label", "PIN digit " + (i + 1));
        boxes.appendChild(inp);
        inputs.push(inp);
      }

      function currentPin() {
        return inputs.map(function (i) { return i.value; }).join("");
      }

      function updateGo() {
        go.disabled = currentPin().length !== LEN;
      }

      inputs.forEach(function (inp, idx) {
        inp.addEventListener("input", function () {
          inp.value = inp.value.replace(/[^0-9]/g, "").slice(-1);
          if (inp.value) FX.sfx("key");
          if (inp.value && idx < LEN - 1) inputs[idx + 1].focus();
          updateGo();
          msg.textContent = "";
          msg.className = "msg";
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && !inp.value && idx > 0) inputs[idx - 1].focus();
          if (e.key === "ArrowLeft" && idx > 0) { e.preventDefault(); inputs[idx - 1].focus(); }
          if (e.key === "ArrowRight" && idx < LEN - 1) { e.preventDefault(); inputs[idx + 1].focus(); }
        });
        inp.addEventListener("focus", function () { try { inp.select(); } catch (err) {} });
        inp.addEventListener("paste", function (e) {
          var text = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "");
          if (!text) return;
          e.preventDefault();
          text.slice(0, LEN).split("").forEach(function (ch, i) { if (inputs[i]) inputs[i].value = ch; });
          var next = Math.min(text.length, LEN) - 1;
          if (inputs[next]) inputs[next].focus();
          updateGo();
        });
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (currentPin() === (C.pin || "")) {
          msg.textContent = "That's the one.";
          msg.className = "msg ok";
          go.disabled = true;
          try { sessionStorage.setItem("capsuleUnlocked", "1"); } catch (err) {}
          try { localStorage.setItem("capsuleUnlocked", "1"); } catch (err) {}
          document.body.classList.add("unlocked");
          FX.sfx("unlock");
          setTimeout(function () { FX.go("main.html"); }, 450);
        } else {
          msg.textContent = "Not quite. Try again.";
          msg.className = "msg err";
          FX.sfx("wrong");
          boxes.classList.remove("shake");
          void boxes.offsetWidth;
          boxes.classList.add("shake");
          inputs.forEach(function (i) { i.value = ""; });
          inputs[0].focus();
          updateGo();
        }
      });

      document.getElementById("back").addEventListener("click", function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        FX.go("index.html");
      });

      inputs[0].focus();
    })();

    /* ---------- twinkling stars behind the lock ---------- */
    (function () {
      var cv = document.getElementById("stars"), g = cv.getContext("2d");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var W, H, stars = [], last = 0;
      function size() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.width = Math.round(innerWidth * dpr); H = cv.height = Math.round(innerHeight * dpr);
        var n = Math.round(innerWidth * innerHeight / 6500); stars = [];
        for (var i = 0; i < n; i++) stars.push({
          x: Math.random() * W, y: Math.random() * H,
          r: (Math.random() < 0.07 ? 1.5 : 0.6 + Math.random() * 0.7) * dpr,
          a: 0.25 + Math.random() * 0.6, s: 0.0006 + Math.random() * 0.002, p: Math.random() * 6.28
        });
        draw(0);
      }
      function draw(t) {
        g.clearRect(0, 0, W, H); g.fillStyle = "#e8eeff";
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          g.globalAlpha = reduce ? s.a : s.a * (0.65 + 0.35 * Math.sin(t * s.s + s.p));
          g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.2832); g.fill();
        }
        g.globalAlpha = 1;
      }
      function frame(t) {
        requestAnimationFrame(frame);
        if (document.hidden || t - last < 50) return;      // ~20 fps is plenty for a twinkle
        last = t; draw(t);
      }
      window.addEventListener("resize", size);
      size();
      if (!reduce) requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
